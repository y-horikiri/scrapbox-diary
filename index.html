<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scrapboxへの投稿フォーム">
    <title>Scrapbox Poster</title>
    <style>
        #text {
            width: 100%;
            height: 200px;
            box-sizing: border-box;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <textarea id="text"></textarea>
    <button id="submit">送信</button>
    <button id="submitNewTab">新しいタブで送信</button>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"
        integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/strftime@0.10.2/strftime-min.min.js"></script>
    <script>
        $(function () {
            // ログインしていないと書き込めないので直書きで公開しても問題なし
            const projectName = 'yhorikiri-underwater'
            const projectURL = `https://scrapbox.io/${projectName}/`;
            const dayJa = ['日', '月', '火', '水', '木', '金', '土'];

            function getDayJa(date) {
                return ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
            }

            function dateStr(date) {
                return `${strftime("%Y-%m-%d", date)} (${getDayJa(date)}) ${strftime("%H:%M", date)}`
            }

            function buildTitle(input, date) {
                return `${strftime("%Y-%m", date)}`;
            }

            function buildBody(input, date) {
                return `${$('#text').val()}
${dateStr(date)}`;
            }

            function submitToScrapbox() {
                const input = $('#text').val();
                const date = new Date();
                const title = buildTitle(input, date);
                const body = buildBody(input, date);
                window.location.href = projectURL + encodeURIComponent(title) + '?body=' + encodeURIComponent(body);
                $('#text').val('');
            }

            function submitToScrapboxInNewTab() {
                const date = new Date();
                const title = buildTitle(date);
                const body = buildBody(date);
                window.open(projectURL + encodeURIComponent(title) + '?body=' + encodeURIComponent(body));
                $('#text').val('');
            }

            $("#text").keydown(function (e) {
                if (e.metaKey && e.keyCode == 13) {
                    submitToScrapbox();
                    return false;
                }
                return true;
            });
            $("#submit").click(submitToScrapbox);
            $("#submitNewTab").click(submitToScrapboxInNewTab);

            // 開いた時にテキストボックスにフォーカスさせる
            $("#text").focus();
        });
    </script>
</body>

</html>
